// ============================================================
// Inetometer — статичная OG-картинка 1200×630 (SVG)
// Используется как fallback og:image для шаринга ссылки.
// ============================================================
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fff5f0"/>
    </linearGradient>
    <linearGradient id="tickGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fc3f1d"/>
      <stop offset="100%" stop-color="#ff7a3d"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="10" fill="#fc3f1d"/>

  <!-- Логотип -->
  <text x="80" y="120" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="700" font-size="56" fill="#1a1a1a">Инетометр</text>
  <circle cx="385" cy="105" r="18" fill="#fc3f1d"/>

  <!-- Подпись -->
  <text x="80" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="500" font-size="24" fill="#666">Открытый спидометр интернета</text>

  <!-- Декоративная дуга шкалы -->
  <g transform="translate(600,500)">
    <ellipse rx="400" ry="180" fill="none" stroke="url(#tickGrad)" stroke-width="4" opacity="0.4"/>
    <!-- 12 тиков как в оригинальной шкале -->
    <g stroke="#fc3f1d" stroke-width="3" stroke-linecap="round">
      <line x1="-400" y1="0" x2="-380" y2="0"/>
      <line x1="-364" y1="-152" x2="-348" y2="-145"/>
      <line x1="-200" y1="-173" x2="-190" y2="-165"/>
      <line x1="0" y1="-180" x2="0" y2="-160"/>
      <line x1="200" y1="-173" x2="190" y2="-165"/>
      <line x1="364" y1="-152" x2="348" y2="-145"/>
      <line x1="400" y1="0" x2="380" y2="0"/>
      <line x1="364" y1="152" x2="348" y2="145"/>
      <line x1="200" y1="173" x2="190" y2="165"/>
      <line x1="0" y1="180" x2="0" y2="160"/>
      <line x1="-200" y1="173" x2="-190" y2="165"/>
      <line x1="-364" y1="152" x2="-348" y2="145"/>
    </g>
    <!-- Указатель где-то на 60% -->
    <circle cx="240" cy="-156" r="10" fill="#fc3f1d" stroke="white" stroke-width="3"/>
  </g>

  <!-- Низ: URL -->
  <text x="80" y="570" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="500" font-size="20" fill="#999">inetometr.ru</text>
  <text x="1120" y="570" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="500" font-size="20" fill="#999" text-anchor="end">v1.6.0</text>
</svg>
